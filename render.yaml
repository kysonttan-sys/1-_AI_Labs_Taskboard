# Render Blueprint — Taskboard (OKR Foundation)
# https://render.com/docs/blueprint-spec
#
# To use: render.com → New → Blueprint → point at this repo.
# You still need to set DATABASE_URL, SESSION_SECRET, and (optional) OLLAMA_URL
# in the service's Environment tab after first deploy. Render will auto-link
# the Postgres service to DATABASE_URL.
#
# IMPORTANT: Migrations are NOT run during build to avoid pg_advisory_lock
# timeouts on pooled connections (e.g. Neon). After first deploy, apply pending
# migrations manually from your machine with:
#   $env:DATABASE_URL = "<direct-connection-string>"
#   npm run db:migrate
# For Neon, use the "Direct" connection URL (no -pooler in the hostname).
# You can also set MIGRATE_DATABASE_URL in Render's shell and run:
#   npm run db:migrate

services:
  - type: web
    name: taskboard
    runtime: node
    plan: starter              # $7/mo — free tier sleeps and breaks Socket.io
    region: oregon             # pick whatever's nearest you
    branch: main
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false             # you set this manually in the dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: taskboard-db
          property: connectionString
      # Optional: direct connection used only for migrations (Neon users).
      # - key: MIGRATE_DATABASE_URL
      #   sync: false
      # Optional AI integration — see docs/ollama-tunnel.md
      # - key: OLLAMA_URL
      #   value: https://ollama.your-domain.com
      # - key: OLLAMA_ENABLED
      #   value: "true"

databases:
  - name: taskboard-db
    plan: starter              # $7/mo Postgres
    region: oregon
    databaseName: taskboard
    user: taskboard
